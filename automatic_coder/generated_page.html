<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Inspired Layout</title>
    <style>
        :root {
            --primary-color: #ff0000;
            --secondary-color: #ffffff;
            --background-color: #f9f9f9;
            --text-color: #000000;
            --spacing: 16px;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing);
            background-color: var(--secondary-color);
        }

        .logo img {
            height: 50px;
        }

        .search-bar input, .search-bar button {
            padding: calc(var(--spacing) / 2);
            border: none;
            outline: none;
        }

        .search-bar input {
            flex: 1;
        }

        .actions button {
            margin-left: var(--spacing);
        }

        main {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: var(--spacing);
            padding: var(--spacing);
        }

        .video-card {
            position: relative;
            background-color: var(--secondary-color);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .video-card img {
            width: 100%;
            display: block;
        }

        .video-info {
            padding: var(--spacing);
        }

        .video-title, .video-meta {
            margin: 0;
        }

        .load-more {
            display: flex;
            justify-content: center;
            padding: var(--spacing);
        }

        footer {
            display: flex;
            justify-content: space-around;
            padding: var(--spacing);
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo"><img src="https://via.placeholder.com/100" alt="Logo"></div>
        <div class="search-bar">
            <input type="text" placeholder="Search...">
            <button>Search</button>
        </div>
        <div class="actions">
            <button>Login</button>
            <button>Signup</button>
        </div>
    </header>
    <nav>
        <div class="chips-row">
            <button>Trending</button>
            <button>Music</button>
            <button>Gaming</button>
            <button>Education</button>
        </div>
    </nav>
    <main class="main-grid">
        <!-- Video Cards will be dynamically added here -->
    </main>
    <div class="load-more"><button>Load More</button></div>
    <footer class="footer">
        <a href="#">About</a>
        <a href="#">Contact Us</a>
        <a href="#">Terms of Service</a>
        <a href="#">Privacy Policy</a>
    </footer>
</body>
</html>
